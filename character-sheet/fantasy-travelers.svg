<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="paint" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2c8"/><stop offset="1" stop-color="#f2b996"/></linearGradient>
    <linearGradient id="skinElf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0e2"/><stop offset="1" stop-color="#f6cfb6"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2683a"/><stop offset=".55" stop-color="#b8401f"/><stop offset="1" stop-color="#7f2715"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#dfe3ec"/><stop offset="1" stop-color="#a9b1c4"/></linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b47a46"/><stop offset=".6" stop-color="#8a5530"/><stop offset="1" stop-color="#5e3820"/></linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f7d63"/><stop offset="1" stop-color="#5f5141"/></linearGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fa36a"/><stop offset=".55" stop-color="#3f7448"/><stop offset="1" stop-color="#284d33"/></linearGradient>
    <linearGradient id="cloakIn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a4a32"/><stop offset="1" stop-color="#3a5f40"/></linearGradient>
    <linearGradient id="tunic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf2dc"/><stop offset="1" stop-color="#e2cfa6"/></linearGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d5233"/><stop offset="1" stop-color="#4a2f1d"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#c08a2a"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd9a8" stop-opacity=".45"/><stop offset="1" stop-color="#ffd9a8" stop-opacity="0"/></radialGradient>
    <style>
      .ln{stroke:#3b2417;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
      .th{stroke:#3b2417;stroke-width:1.6;fill:none;stroke-linecap:round}
      .hl{fill:#fff;opacity:.35}
      .sh{fill:#3b2417;opacity:.14}
      text{font-family:Georgia,'Times New Roman',serif;fill:#4a2f1d}
      .lbl{font-size:20px;letter-spacing:4px;fill:#8a6a50}
      .nm{font-size:30px;font-style:italic}
      .note{font-size:15px;fill:#7a5e48}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>
  <!-- warm painterly glows behind each pair -->
  <ellipse cx="380" cy="640" rx="330" ry="300" fill="url(#glow)"/>
  <ellipse cx="1130" cy="560" rx="360" ry="380" fill="url(#glow)"/>

  <text x="800" y="60" text-anchor="middle" style="font-size:40px;letter-spacing:3px">Fantasy Travelers — Character Sheet</text>
  <line x1="560" y1="80" x2="1040" y2="80" stroke="#d9b98f" stroke-width="2"/>
  <line x1="760" y1="130" x2="760" y2="940" stroke="#eadbc6" stroke-width="2" stroke-dasharray="6 8"/>
  <line x1="60" y1="880" x2="1540" y2="880" stroke="#eadbc6" stroke-width="2"/>

  <text x="380" y="130" text-anchor="middle" class="nm">Borin Emberbraid · Dwarf</text>
  <text x="1130" y="130" text-anchor="middle" class="nm">Sylwen Ashleaf · Elf</text>

